# 网络安全雷达配置 — 无需改代码即可调整采集范围
# 不存在时使用 src/lib/config.ts 中的内置默认值

# CVE 采集阈值：仅保留 CVSS 基础分 >= 该值的漏洞
cve:
  min_cvss: 7.0
  # 最近多少小时内更新的 CVE
  lookback_hours: 36
  # 最多保留条数
  max_items: 40

# 关注的厂商/关键词（命中则优先排序，不限制采集）
focus_keywords:
  - microsoft
  - windows
  - linux
  - cisco
  - fortinet
  - palo alto
  - vmware
  - apache
  - openssl
  - kubernetes
  - docker
  - chrome
  - android
  - ios

# 安全资讯 RSS 源
news_feeds:
  # 中文源（国内服务器可直接访问）
  - name: 安全客
    url: https://api.anquanke.com/data/v1/rss
    lang: zh
  - name: 先知社区
    url: https://xz.aliyun.com/feed
    lang: zh
  - name: Seebug Paper
    url: https://paper.seebug.org/rss/
    lang: zh
  # 英文源（The Hacker News、BleepingComputer 在国内访问不了，可用环境变量 NEWS_SKIP 跳过）
  - name: Krebs on Security
    url: https://krebsonsecurity.com/feed/
    lang: en
  - name: Schneier on Security
    url: https://www.schneier.com/feed/atom/
    lang: en
  - name: The Hacker News
    url: https://feeds.feedburner.com/TheHackersNews
    lang: en
  - name: BleepingComputer
    url: https://www.bleepingcomputer.com/feed/
    lang: en

# 每个源最多保留条数
limits:
  news_max: 30
  ghsa_max: 25
  kev_max: 20
  # 长亭漏洞库（中文）条数
  cn_max: 15
